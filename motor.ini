[driver]
chip = 0
step_pin = 12
dir_pin = 20
ms1_pin = 16
ms2_pin = 19
ms3_pin = 13
sleep_pin = 17
enable_pin = 6
reset_pin = 5
feedback_pin = -1          ; Set to -1 to disable loopback.
                           ; This invalidates position after a stop-mid-motion.

[motion]
microsteps = 16
default_speed = 200        ; Full steps / sec
pulse_width_us = 20        ; STEP high time
max_accel = 0              ; Full steps / sec^2. 0 disables ramping
                           ; (motor jumps straight to default_speed).
dir_polarity = H           ; H: Forward=HIGH, L: Forward=LOW

[limits]
soft_limit_min = 0
soft_limit_max = 0