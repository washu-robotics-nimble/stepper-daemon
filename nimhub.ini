; nimhubd sample config (docs/daemon/spec.md, D-R3, D-R43).
; Behavioural settings only: pins and wiring are in the firmware's board table.

[daemon]
; The MCU's USB serial device; /dev/serial/by-id/ gives each board a stable name
device = /dev/serial/by-id/usb-wurc_controller_hub_554D45060C14CCBA-if00
; Client socket and its group (D-R12); used from build plan step 9
; socket = /run/nimhubd/control.sock
socket = /run/user/1000/control.sock
group = stepper
; A client's lease expires after this long without renew (D-R18)
lease_timeout_ms = 5000

[link]
report_period = 250       ; ms between position events during a move; 0 = off (F-R32)
timeout_ms = 1000         ; the firmware stops motion after this long without a frame; 0 = off (F-R22)
                          ; nimhubd pings when it has sent nothing for a quarter of it
reply_timeout_ms = 500    ; a reply missing for this long is a link drop (D-R30)

; One section per device, named by its oid. A key left out keeps the firmware's
; built-in default, except the soft limits: left out means no limit.
[m0]
microsteps = 16           ; 1, 2, 4, 8 or 16
speed = 200               ; full steps/s
accel = 400               ; full steps/s^2, at least 1; very large: in effect no ramp
pulse_width_us = 20       ; STEP high time
dir_polarity = H          ; H: DIR high for positive moves; L: low
endstop = false           ; endstop installed (D-R44)
; soft_limit_min = 0      ; full steps (F-R25)
; soft_limit_max = 20000
